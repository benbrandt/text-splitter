name: Release preparation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Prepare release PR
    # Never run against a fork or prepare releases from a feature branch.
    if: >-
      github.repository == 'benbrandt/text-splitter' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check release App configuration
        id: app-config
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release preparation skipped: configure RELEASE_PLZ_APP_CLIENT_ID and RELEASE_PLZ_APP_PRIVATE_KEY secrets."
          fi
      - name: Checkout
        if: steps.app-config.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.app-config.outputs.ready == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.app-config.outputs.ready == 'true'
      - name: Create release App token
        id: app-token
        if: steps.app-config.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: text-splitter
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update release PR
        if: steps.app-config.outputs.ready == 'true'
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f
        with:
          # Omitting command would also run `release` and publish packages.
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
