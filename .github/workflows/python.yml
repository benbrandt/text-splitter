# This file is based on maturin-generated CI.
# To update the base workflow, run
#
#    maturin generate-ci -m Cargo.toml -o ../../.github/workflows/python.yml --pytest github
#
# Keep the additional free-threaded/abi3t builds, runtime tests, and stub checks below.

name: Python

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bindings/python

permissions:
  contents: read

jobs:
  min_supported_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: "py310_linux"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: x86_64
          args: --release --out dist
          manylinux: 2_28
          working-directory: bindings/python
      - name: pytest
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: linux-${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: 2_28
          working-directory: bindings/python
      - name: pytest
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
          manylinux: 2_28
          working-directory: bindings/python
      - name: Build stable free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --no-default-features --features abi3t -i python3.15t
          manylinux: 2_28
          working-directory: bindings/python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: windows-${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
      - name: pytest
        if: ${{ !startsWith(matrix.target, 'x86') }}
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest
      - name: Set up free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.target }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
          working-directory: bindings/python
      - name: Set up stable free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
          architecture: ${{ matrix.target }}
      - name: Build stable free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --no-default-features --features abi3t -i python3.15t
          working-directory: bindings/python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macox-${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
      - name: pytest
        if: ${{ startsWith(matrix.target, 'aarch64') }}
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest
      - name: Set up free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
          working-directory: bindings/python
      - name: Set up stable free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Build stable free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --no-default-features --features abi3t -i python3.15t
          working-directory: bindings/python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  runtime:
    name: Runtime (${{ matrix.platform.os }}, ${{ matrix.runtime.python }}, ${{ matrix.runtime.tag }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
          - os: windows-latest
            artifact: wheels-windows-x64
          - os: macos-latest
            artifact: wheels-macos-aarch64
        runtime:
          - python: "3.15"
            tag: cp310-abi3
            wheel: "*-cp310-abi3-*.whl"
          - python: "3.14t"
            tag: cp314-cp314t
            wheel: "*-cp314-cp314t-*.whl"
          - python: "3.15t"
            tag: cp315-abi3t
            wheel: "*-cp315-abi3.abi3t-*.whl"
          # abi3t wheels are dual-ABI: users on ordinary 3.15 can select them too.
          - python: "3.15"
            tag: cp315-abi3
            wheel: "*-cp315-abi3.abi3t-*.whl"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform.artifact }}
          path: bindings/python/dist
      - name: Install and verify wheel
        shell: bash
        run: |
          set -e
          python -m pip install --no-index dist/${{ matrix.runtime.wheel }}
          python scripts/check_wheel.py ${{ matrix.runtime.tag }}
      - name: pytest with Python integrations
        if: ${{ matrix.runtime.python == '3.15' }}
        shell: bash
        run: |
          set -e
          python -m pip install pytest tokenizers tree-sitter tree-sitter-python
          python -m pytest
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: ${{ endsWith(matrix.runtime.python, 't') }}
        with:
          toolchain: stable
      - name: Build native test grammar
        if: ${{ endsWith(matrix.runtime.python, 't') }}
        run: cargo build --locked --manifest-path tests/grammar/Cargo.toml --target-dir ../../target/test-grammar
      - name: pytest without the GIL
        if: ${{ endsWith(matrix.runtime.python, 't') }}
        shell: bash
        run: |
          set -e
          python -m pip install pytest
          python -m pytest tests/test_threading.py

  typing:
    name: Type stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: typing
      - run: python -m pip install -r requirements-typing.txt
      - name: Check generated stubs
        run: python scripts/generate_stubs.py --check
      - name: Check typed API usage
        run: mypy --strict --python-version 3.10 tests/typecheck.py
      - name: Check runtime signatures
        shell: bash
        run: |
          set -e
          maturin build --locked --out dist
          python -m pip install --no-index --find-links dist semantic-text-splitter
          python -m mypy.stubtest semantic_text_splitter --allowlist tests/stubtest-allowlist.txt

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: sdist
      # There is an issue with sdist build where duplicate readmes are found for some reason.
      - run: rm ../../README.md
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: bindings/python/dist
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: [linux, windows, macos, sdist, runtime, typing]
    # This job doesn't check out the repo, so override the workflow-level
    # default that sets the working directory to bindings/python.
    defaults:
      run:
        working-directory: .
    steps:
      # Flatten every wheel artifact and the sdist into dist/ so `uv publish`
      # can pick them up with its default dist/* path. This matches the
      # "download all artifacts to dist/* and run uv publish" workflow
      # recommended by uv itself.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          # No checkout happens here, so there are no dependency files to
          # cache against. Disable the cache to avoid warnings.
          enable-cache: "false"
      - run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
