# This file is based on maturin-generated CI.
# To update the base workflow, run
#
#    maturin generate-ci -m Cargo.toml -o ../../.github/workflows/python.yml --pytest github
#
# Keep the additional free-threaded/abi3t builds, runtime tests, and stub checks below.

name: Python

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a tag's publication with a retry or manual dispatch.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

defaults:
  run:
    working-directory: bindings/python

permissions:
  contents: read

jobs:
  min_supported_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: "py310_linux"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: x86_64
          args: --release --out dist
          manylinux: 2_28
          working-directory: bindings/python
      - name: pytest
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: linux-${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: 2_28
          working-directory: bindings/python
      - name: pytest
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
          manylinux: 2_28
          working-directory: bindings/python
      - name: Build stable free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --no-default-features --features abi3t -i python3.15t
          manylinux: 2_28
          working-directory: bindings/python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: windows-${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
      - name: pytest
        if: ${{ !startsWith(matrix.target, 'x86') }}
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest
      - name: Set up free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.target }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
          working-directory: bindings/python
      - name: Set up stable free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
          architecture: ${{ matrix.target }}
      - name: Build stable free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --no-default-features --features abi3t -i python3.15t
          working-directory: bindings/python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macox-${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
      - name: pytest
        if: ${{ startsWith(matrix.target, 'aarch64') }}
        shell: bash
        run: |
          set -e
          pip install --force-reinstall --no-index --find-links dist semantic-text-splitter
          pip install pytest tokenizers tree-sitter tree-sitter-python
          pytest
      - name: Set up free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
          working-directory: bindings/python
      - name: Set up stable free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Build stable free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --no-default-features --features abi3t -i python3.15t
          working-directory: bindings/python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  runtime:
    name: Runtime (${{ matrix.platform.os }}, ${{ matrix.runtime.python }}, ${{ matrix.runtime.tag }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
          - os: windows-latest
            artifact: wheels-windows-x64
          - os: macos-latest
            artifact: wheels-macos-aarch64
        runtime:
          - python: "3.15"
            tag: cp310-abi3
            wheel: "*-cp310-abi3-*.whl"
          - python: "3.14t"
            tag: cp314-cp314t
            wheel: "*-cp314-cp314t-*.whl"
          - python: "3.15t"
            tag: cp315-abi3t
            wheel: "*-cp315-abi3.abi3t-*.whl"
          # abi3t wheels are dual-ABI: users on ordinary 3.15 can select them too.
          - python: "3.15"
            tag: cp315-abi3
            wheel: "*-cp315-abi3.abi3t-*.whl"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform.artifact }}
          path: bindings/python/dist
      - name: Install and verify wheel
        shell: bash
        run: |
          set -e
          python -m pip install --no-index dist/${{ matrix.runtime.wheel }}
          python scripts/check_wheel.py ${{ matrix.runtime.tag }}
      - name: pytest with Python integrations
        if: ${{ matrix.runtime.python == '3.15' }}
        shell: bash
        run: |
          set -e
          python -m pip install pytest tokenizers tree-sitter tree-sitter-python
          python -m pytest
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: ${{ endsWith(matrix.runtime.python, 't') }}
        with:
          toolchain: stable
      - name: Build native test grammar
        if: ${{ endsWith(matrix.runtime.python, 't') }}
        run: cargo build --locked --manifest-path tests/grammar/Cargo.toml --target-dir ../../target/test-grammar
      - name: pytest without the GIL
        if: ${{ endsWith(matrix.runtime.python, 't') }}
        shell: bash
        run: |
          set -e
          python -m pip install pytest
          python -m pytest tests/test_threading.py

  typing:
    name: Type stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: typing
      - run: python -m pip install -r requirements-typing.txt
      - name: Check generated stubs
        run: python scripts/generate_stubs.py --check
      - name: Check typed API usage
        run: mypy --strict --python-version 3.10 tests/typecheck.py
      - name: Check runtime signatures
        shell: bash
        run: |
          set -e
          maturin build --locked --out dist
          python -m pip install --no-index --find-links dist semantic-text-splitter
          python -m mypy.stubtest semantic_text_splitter --allowlist tests/stubtest-allowlist.txt

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: sdist
      # There is an issue with sdist build where duplicate readmes are found for some reason.
      - run: rm ../../README.md
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: bindings/python/dist
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'benbrandt/text-splitter' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [min_supported_version, linux, windows, macos, sdist, runtime, typing]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: "false"
      - name: Publish with PyPI trusted publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz

  finalize:
    name: Finalize GitHub release
    needs: release
    if: >-
      github.repository == 'benbrandt/text-splitter' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Create finalization App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: text-splitter
          permission-contents: write
      - name: Publish the GitHub draft
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.id')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=legacy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
